name: Homebrew Publish

on:
  workflow_run:
    workflows: ["Build and Release", "Release (macOS)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.1)'
        required: true
        default: 'v0.1.1'

permissions:
  contents: read
  actions: read

jobs:
  homebrew-pr:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.name == 'Release (macOS)')
    steps:
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            VERSION="${{ github.event.workflow_run.head_branch }}"
          fi
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" | tee -a $GITHUB_ENV
          echo "HEAD_SHA=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_ENV

      - name: Wait for both workflows to complete
        run: |
          echo "Waiting for both workflows to complete..."
          for i in {1..40}; do
            echo "Attempt $i: Checking workflow status..."

            # Check Linux/Windows workflow status (scoped to this commit)
            MAIN_STATUS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/Buct0r/PassPort/actions/workflows/build-release.yml/runs?head_sha=$HEAD_SHA&status=completed&per_page=1" \
              | jq -r '.workflow_runs[0].conclusion // "not_found"')

            # Check macOS workflow status (scoped to this commit)
            MACOS_STATUS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/Buct0r/PassPort/actions/workflows/build-release-macos.yml/runs?head_sha=$HEAD_SHA&status=completed&per_page=1" \
              | jq -r '.workflow_runs[0].conclusion // "not_found"')

            echo "Linux/Windows: $MAIN_STATUS, macOS: $MACOS_STATUS"

            if [ "$MAIN_STATUS" = "success" ] && [ "$MACOS_STATUS" = "success" ]; then
              echo "Both workflows completed successfully!"
              break
            fi

            if [ $i -eq 40 ]; then
              echo "ERROR: Timed out waiting for workflows"
              exit 1
            fi

            echo "Waiting for both workflows to complete, retrying in 30 seconds..."
            sleep 30
          done

          # Extra wait to ensure releases are published
          echo "Waiting additional 60 seconds for releases to be published..."
          sleep 60

      - name: Download checksums (Windows/Linux)
        run: |
          for i in {1..5}; do
            echo "Download attempt $i..."
            curl -sL "https://github.com/Buct0r/PassPort/releases/download/v${{ env.VERSION }}/checksums.txt" -o /tmp/checksums.txt
            if [ -s /tmp/checksums.txt ] && grep -q "linux-amd64" /tmp/checksums.txt; then
              echo "Successfully downloaded checksums.txt"
              cat /tmp/checksums.txt
              break
            fi
            echo "checksums.txt not ready yet, retrying in 15 seconds..."
            sleep 15
          done
          if [ ! -s /tmp/checksums.txt ]; then
            echo "ERROR: Failed to download checksums.txt"
            exit 1
          fi

      - name: Download checksums (macOS)
        run: |
          for i in {1..5}; do
            echo "Download attempt $i..."
            curl -sL "https://github.com/Buct0r/PassPort/releases/download/v${{ env.VERSION }}/checksums-macos.txt" -o /tmp/checksums-macos.txt
            if [ -s /tmp/checksums-macos.txt ] && grep -q "darwin" /tmp/checksums-macos.txt; then
              echo "Successfully downloaded checksums-macos.txt"
              cat /tmp/checksums-macos.txt
              break
            fi
            echo "checksums-macos.txt not ready yet, retrying in 15 seconds..."
            sleep 15
          done
          if [ ! -s /tmp/checksums-macos.txt ]; then
            echo "WARNING: Failed to download checksums-macos.txt, will use Linux fallbacks"
          fi
        continue-on-error: true

      - name: Extract SHA256 hashes
        run: |
          SHA_LIN=$(grep "linux-amd64" /tmp/checksums.txt | head -1 | awk '{print $1}')
          GUI_LIN=$(grep "PassPort-gui.*linux-amd64" /tmp/checksums.txt | head -1 | awk '{print $1}')
          if [ -f /tmp/checksums-macos.txt ]; then
            SHA_ARM=$(grep "darwin-arm64" /tmp/checksums-macos.txt | head -1 | awk '{print $1}')
            SHA_AMD=$(grep "darwin-amd64" /tmp/checksums-macos.txt | head -1 | awk '{print $1}')
            GUI_ARM=$(grep "PassPort-gui.*darwin-arm64" /tmp/checksums-macos.txt | head -1 | awk '{print $1}')
            GUI_AMD=$(grep "PassPort-gui.*darwin-amd64" /tmp/checksums-macos.txt | head -1 | awk '{print $1}')
          fi
          # Fallback to Linux if macOS not found
          ARM="${ARM:-$SHA_LIN}"
          AMD="${AMD:-$SHA_LIN}"
          GUI_ARM="${GUI_ARM:-$ARM}"
          GUI_AMD="${GUI_AMD:-$AMD}"
          echo "LINUX=$SHA_LIN"
          echo "CLI_ARM64=$ARM"
          echo "CLI_AMD64=$AMD"
          echo "GUI_ARM64=$GUI_ARM"
          echo "GUI_AMD64=$GUI_AMD"
          echo "SHA_LIN=$SHA_LIN" >> $GITHUB_ENV
          echo "SHA_ARM=$ARM" >> $GITHUB_ENV
          echo "SHA_AMD=$AMD" >> $GITHUB_ENV
          echo "GUI_ARM=$GUI_ARM" >> $GITHUB_ENV
          echo "GUI_AMD=$GUI_AMD" >> $GITHUB_ENV
          echo "GUI_LIN=$GUI_LIN" >> $GITHUB_ENV

      - name: Clone or init repo
        run: |
          cd /tmp
          rm -rf homebrew-PassPort
          mkdir -p homebrew-PassPort
          cd homebrew-PassPort
          git clone https://github.com/Buct0r/homebrew-PassPort.git . 2>/dev/null || {
            echo "Initializing new repo"
            git init
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
          }

      - name: Create CLI-only formula
        run: |
          cd /tmp/homebrew-PassPort
          mkdir -p Formula
          VER="${{ env.VERSION }}"
          ARM="${{ env.SHA_ARM }}"
          AMD="${{ env.SHA_AMD }}"
          LIN="${{ env.SHA_LIN }}"

          printf 'class PassportCli < Formula\n  desc "A secure password manager CLI for macOS and Linux"\n  homepage "https://github.com/Buct0r/PassPort"\n  version "%s"\n  license "MIT"\n\n  on_macos do\n    if Hardware::CPU.arm?\n      url "https://github.com/Buct0r/PassPort/releases/download/v%s/PassPort-cli-%s-darwin-arm64.tar.gz"\n      sha256 "%s"\n    else\n      url "https://github.com/Buct0r/PassPort/releases/download/v%s/PassPort-cli-%s-darwin-amd64.tar.gz"\n      sha256 "%s"\n    end\n  end\n\n  on_linux do\n    url "https://github.com/Buct0r/PassPort/releases/download/v%s/PassPort-cli-%s-linux-amd64.tar.gz"\n    sha256 "%s"\n  end\n\n  def install\n    bin.install "passport-cli"\n  end\n\n  test do\n    system "#{bin}/passport-cli", "--version"\n  end\nend\n' "$VER" "$VER" "$VER" "$ARM" "$VER" "$VER" "$AMD" "$VER" "$VER" "$LIN" > Formula/passport-cli.rb
          echo "=== CLI-only Formula ==="
          cat Formula/passport-cli.rb

      - name: Create combined formula (GUI + CLI)
        run: |
          cd /tmp/homebrew-PassPort
          rm -rf Casks
          VER="${{ env.VERSION }}"
          GUI_ARM="${{ env.GUI_ARM }}"
          GUI_AMD="${{ env.GUI_AMD }}"
          GUI_LIN="${{ env.GUI_LIN }}"
          SHA_ARM="${{ env.SHA_ARM }}"
          SHA_AMD="${{ env.SHA_AMD }}"
          LIN="${{ env.SHA_LIN }}"

          printf 'class Passport < Formula\n  desc "A secure password manager for macOS and Linux (GUI + CLI)"\n  homepage "https://github.com/Buct0r/PassPort"\n  version "%s"\n  license "MIT"\n\n  on_macos do\n    if Hardware::CPU.arm?\n      url "https://github.com/Buct0r/PassPort/releases/download/v%s/PassPort-gui-%s-darwin-arm64.tar.gz"\n      sha256 "%s"\n\n      resource "cli" do\n        url "https://github.com/Buct0r/PassPort/releases/download/v%s/PassPort-cli-%s-darwin-arm64.tar.gz"\n        sha256 "%s"\n      end\n    else\n      url "https://github.com/Buct0r/PassPort/releases/download/v%s/PassPort-gui-%s-darwin-amd64.tar.gz"\n      sha256 "%s"\n\n      resource "cli" do\n        url "https://github.com/Buct0r/PassPort/releases/download/v%s/PassPort-cli-%s-darwin-amd64.tar.gz"\n        sha256 "%s"\n      end\n    end\n  end\n\n  on_linux do\n    url "https://github.com/Buct0r/PassPort/releases/download/v%s/PassPort-gui-%s-linux-amd64.tar.gz"\n    sha256 "%s"\n\n    resource "cli" do\n      url "https://github.com/Buct0r/PassPort/releases/download/v%s/PassPort-cli-%s-linux-amd64.tar.gz"\n      sha256 "%s"\n    end\n  end\n\n  def install\n    bin.install "passport"\n    resource("cli").stage { bin.install "passport-cli" }\n  end\n\n  test do\n    system "#{bin}/passport", "--version"\n  end\nend\n' "$VER" "$VER" "$VER" "$GUI_ARM" "$VER" "$VER" "$SHA_ARM" "$VER" "$VER" "$GUI_AMD" "$VER" "$VER" "$SHA_AMD" "$VER" "$VER" "$GUI_LIN" "$VER" "$VER" "$LIN" > Formula/passport.rb
          echo "=== Combined Formula ==="
          cat Formula/passport.rb

      - name: Commit and push
        run: |
          cd /tmp/homebrew-PassPort
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git status
          git commit -m "Update PassPort to v${{ env.VERSION }}" || echo "No changes"
          git branch -M main
          git push https://${{ secrets.HOMEBREW_TOKEN_PASSPORT }}@github.com/Buct0r/homebrew-PassPort.git main --force
