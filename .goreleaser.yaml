version: 2

project_name: PassPort

before:
  hooks:
    - go mod download
    - go mod tidy

builds:
  # GUI builds
  - id: gui-windows-amd64
    main: ./src
    binary: passport
    goos:
      - windows
    goarch:
      - amd64
    env:
      - CGO_ENABLED=1
      - CC=x86_64-w64-mingw32-gcc
      - CXX=x86_64-w64-mingw32-g++
    ldflags:
      - -H windowsgui

  - id: gui-linux-amd64
    main: ./src
    binary: passport
    goos:
      - linux
    goarch:
      - amd64
    env:
      - CGO_ENABLED=1

  # CLI builds
  - id: cli-windows-amd64
    main: ./cli
    binary: passport-cli
    goos:
      - windows
    goarch:
      - amd64
    env:
      - CGO_ENABLED=0

  - id: cli-windows-arm64
    main: ./cli
    binary: passport-cli
    goos:
      - windows
    goarch:
      - arm64
    env:
      - CGO_ENABLED=0

  - id: cli-linux-amd64
    main: ./cli
    binary: passport-cli
    goos:
      - linux
    goarch:
      - amd64
    env:
      - CGO_ENABLED=0

  - id: cli-linux-arm64
    main: ./cli
    binary: passport-cli
    goos:
      - linux
    goarch:
      - arm64
    env:
      - CGO_ENABLED=0

archives:
  - id: gui-windows
    builds:
      - gui-windows-amd64
    name_template: "{{ .ProjectName }}-gui-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format: zip
    files:
      - none*

  - id: gui-unix
    builds:
      - gui-linux-amd64
    name_template: "{{ .ProjectName }}-gui-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format: tar.gz
    files:
      - none*

  - id: cli-windows
    builds:
      - cli-windows-amd64
      - cli-windows-arm64
    name_template: "{{ .ProjectName }}-cli-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format: zip
    files:
      - none*

  - id: cli-unix
    builds:
      - cli-linux-amd64
      - cli-linux-arm64
    name_template: "{{ .ProjectName }}-cli-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format: tar.gz
    files:
      - none*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

nfpms:
  - id: gui-linux
    package_name: passport
    builds:
      - gui-linux-amd64
    formats:
      - deb
      - rpm
    vendor: Buct0r
    homepage: https://github.com/Buct0r/PassPort
    maintainer: Buct0r
    description: |-
      A secure, cross-platform password manager built with Go and Fyne.
      PassPort provides both a graphical user interface (GUI) and
      command-line interface (CLI) for managing encrypted passwords.
    license: MIT
    section: utils
    priority: optional
    recommends:
      - passport-cli
    contents:
      - src: img/logo.png
        dst: /usr/share/pixmaps/passport.png
      - src: packaging/passport.desktop
        dst: /usr/share/applications/passport.desktop
    overrides:
      deb:
        dependencies:
          - libgl1
          - libxcursor1
          - libxrandr2
          - libxinerama1
      rpm:
        dependencies:
          - mesa-libGL
          - libXcursor
          - libXrandr
          - libXinerama

  - id: cli-linux
    package_name: passport-cli
    builds:
      - cli-linux-amd64
      - cli-linux-arm64
    formats:
      - deb
      - rpm
    vendor: Buct0r
    homepage: https://github.com/Buct0r/PassPort
    maintainer: Buct0r
    description: |-
      A secure password manager command-line interface.
      Manage encrypted passwords and sensitive information from the terminal.
    license: MIT
    section: utils
    priority: optional

snapshot:
  name_template: "{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))?!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))?!?:.+$'
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: Buct0r
    name: PassPort
  draft: false
  prerelease: false

